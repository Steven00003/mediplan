<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>MediPlan · imagen Open Graph</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 18% 18%, rgba(168, 230, 176, 0.35), transparent 38%),
        linear-gradient(135deg, #102516 0%, #1B3A21 58%, #245A31 100%);
      color: #F8F9FA;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .card {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 56px;
      align-items: center;
      width: 1080px;
      height: 510px;
      padding: 48px 56px;
      border: 1px solid rgba(168, 230, 176, 0.45);
      border-radius: 32px;
      background: rgba(8, 16, 9, 0.35);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
    }
    img { display: block; width: 280px; height: 280px; object-fit: contain; }
    p { margin: 0; }
    .eyebrow {
      color: #A8E6B0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 12px 0 18px;
      font-size: 104px;
      line-height: 0.95;
      letter-spacing: -0.04em;
    }
    .lead {
      max-width: 620px;
      color: #E6F2E8;
      font-size: 34px;
      font-weight: 650;
      line-height: 1.25;
    }
    .meta {
      margin-top: 28px;
      color: #A8E6B0;
      font-size: 24px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="../docs/img/logo-440.png" width="440" height="440" alt="Logo de MediPlan">
    <div>
      <p class="eyebrow">Pastillero familiar</p>
      <h1>MediPlan</h1>
      <p class="lead">El cuidador arma el plan. El paciente confirma cada toma.</p>
      <p class="meta">mediplan-35953.web.app</p>
    </div>
  </div>
</body>
</html>
